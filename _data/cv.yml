    Telescope Time:
      - label: "Que SIRAH: Completing the Low-Redshift NIR Supernova Anchor for Roman"
        details: "HST Cycle 34 (PID 18377), Principal Investigator — 14 primary HST orbits. Templates to reduce host contamination in SIRAH SN photometry, completing the NIR anchor for Roman."

      - label: Taking Aim at Precision Cosmology with SN Atalanta
        details: "JWST Cycle 4 DDT (PID 12774), Principal Investigator — 3.4 hrs JWST NIRCam + 4 HST orbits. DDT follow-up of a VENUS-discovered lensed SN IIP to measure time delays and H₀."

      - label: Setting the Clock for the First Future Lensed Supernova Reappearance Beyond z=2
        details: "JWST Cycle 5 DDT (PID 12782), Co-Investigator (PI: Fujimoto) — 9.3 hrs JWST NIRCam + NIRSpec. Follow-up of a z ~ 3–4 cluster-lensed SN with a predicted future reappearance, opening time-delay H₀ cosmography beyond z=2 for the first time."

      - label: "LensTrove: Unlocking the Cosmological Power of Cluster-lensed Supernovae"
        details: "HST Cycle 34 (PID 18395), Co-Investigator (PI: Larison) — 27 primary HST orbits + 21.90 hrs JWST. ToO observations of 3 glSNe for a < 2.5% H₀ measurement, enabling a > 3σ statement on the Hubble Tension."

      - label: Completing a Legacy Dataset with Deep HST Imaging of 121 Nearby Star-Forming Galaxies
        details: "HST Cycle 34 (PID 18338), Co-Investigator (PI: Kilpatrick) — 193 primary + 138 parallel spacecraft orbits."

      - label: Catching Eos by the Tail
        details: "JWST Cycle 5 (PID 12299), Co-Investigator (PI: Larison) — 29.2 hrs JWST NIRSpec. Spectroscopic follow-up of lensed SN Eos during radioactive decline to measure ejecta velocity and metallicity."

      - label: "Requiem's Return: Precision Cosmology from a Decade-Delayed, Strongly-Lensed Supernova and Its New Sibling"
        details: "HST Cycles 33 & 34 (PID 18069), Co-Investigator (PI: Pierel) — 14 (C33) + 12 (C34) HST orbits + 25.80 hrs JWST. Monitoring for Requiem's return and obtaining follow-up observations."

      - label: "Standard-ish Candles: Measuring SN Ia Luminosity Drift at z > 3"
        details: "JWST Cycle 5 (PID 12146), Co-Investigator (PI: Pierel) — 120.9 primary spacecraft hours. Building a z ≳ 3 SN Ia sample via 5 ToOs to test luminosity drift and constrain bias below Roman precision."

